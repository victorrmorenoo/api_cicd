name: Python application

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest httpx
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: python -m pytest -q
  Imagem:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_SENHA}}
      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: victoormorenoo/fastapi-app:${{ github.sha }}
  Deploy_Homologacao:
    needs: Imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 44.208.230.33
          username: ubuntu
          key: ${{secrets.CHAVE}}
          script: | 
              set -e
              echo "Acesso liberado"
              sudo docker pull victoormorenoo/fastapi-app:${{ github.sha }}
              sudo docker rm -f fastapi-app 2>/dev/null || true

              # Instalar nova versão
              sudo docker run --name fastapi-app -d -p 8080:8080 victoormorenoo/fastapi-app:${{ github.sha }}
  Deploy_Producao:
    needs: Imagem
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: producao

    steps:
      - name: Deploy na EC2 de producao
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            sudo docker pull victoormorenoo/fastapi-app:${{ github.sha }}
            sudo docker rm -f fastapi-app 2>/dev/null || true

            sudo docker run --name fastapi-app -d \
              --restart unless-stopped \
              -p 80:8080 \
              victoormorenoo/fastapi-app:${{ github.sha }}
